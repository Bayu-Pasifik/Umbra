[package]
name = "umbra"
version = "0.1.0"
edition = "2021"
description = "A Nusa-style dynamic island for the desktop"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
