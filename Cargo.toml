[package]
name = "umbra"
version = "0.1.0"
edition = "2021"
description = "A Nusa-style dynamic island for the desktop"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Drag-out needs OS drag-and-drop APIs; Linux has no winit-compatible backend (GTK only).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
