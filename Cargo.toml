[package]
name = "umbra"
version = "0.1.0"
edition = "2021"
description = "A Nusa-style dynamic island for the desktop"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

# Drag-out needs OS drag-and-drop APIs; Linux has no winit-compatible backend (GTK only).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Metal on macOS; Vulkan (always built) on Windows and Linux. DX12 was tried on Windows but
# kept the event loop spinning with a transparent surface.
[target.'cfg(target_os = "macos")'.dependencies.wgpu]
version = "24"
default-features = false
features = ["metal", "wgsl"]

# Real system media session (Now Playing) on Windows.
[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = ["Media_Control", "Foundation"]
