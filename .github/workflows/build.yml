name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: umbra-linux-x86_64
            binary: umbra
          - os: windows-latest
            name: umbra-windows-x86_64
            binary: umbra.exe
          - os: macos-latest
            name: umbra-macos-aarch64
            binary: umbra
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/release/${{ matrix.binary }} dist/${{ matrix.name }}/
          cp README.md dist/${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
